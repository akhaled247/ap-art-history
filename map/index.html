<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../images/favicon.png">
  <title>AP Art History: Interactive Map & Timeline</title>
  
  <!-- Vendor Stylesheets -->
  <link rel="stylesheet" href="../css/vendor/leaflet.css">
  <link rel="stylesheet" href="../css/vendor/MarkerCluster.css">
  
  <!-- Main Academic Stylesheet -->
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <!-- Top Navigation & Controls Header -->
  <header class="app-header" role="banner">
    <div class="header-top">
      <div class="brand-title">
        <h1>AP Art History</h1>
        <!-- Note: Displays "X/250 Required Works" where X is the number of works that have been updated -->
        <span class="badge">98/250 Required Works</span>
      </div>

      <!-- Search Bar -->
      <div class="search-container" role="search">
        <label for="artwork-search-input" class="sr-only">Search artworks by CED number, title, artist, culture, or location</label>
        <input 
          type="text" 
          id="artwork-search-input" 
          class="search-input" 
          placeholder="Search by title, artist, CED #, culture..." 
          autocomplete="off" 
          aria-expanded="false" 
          aria-haspopup="listbox"
        >
        <button id="search-clear-btn" class="search-clear" aria-label="Clear search input">&times;</button>
        <div id="search-dropdown" class="search-dropdown" role="listbox"></div>
      </div>

      <!-- Global Actions -->
      <div class="header-controls">
        <a href="./" class="btn btn-subtle header-nav-link active" aria-current="page">Map</a>
        <a href="../" class="btn btn-subtle header-nav-link">Browse List</a>
        <a href="../vocab/" class="btn btn-subtle header-nav-link">Vocabulary</a>
        <a href="../network/" class="btn btn-subtle header-nav-link">Network</a>
        <button id="random-artwork-btn" class="btn btn-primary" title="Explore a random artwork from the filtered set">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          Random Artwork
        </button>
        <button id="reset-filters-btn" class="btn btn-subtle" title="Reset timeline and all filters">
          Reset All
        </button>
      </div>
    </div>

    <!-- Unit Presets Bar -->
    <div class="header-bottom">
      <nav class="unit-presets" id="unit-presets-nav" aria-label="AP Art History Unit Presets">
        <button class="unit-tab active" data-unit="all">All Works (1–250)</button>
        <button class="unit-tab" data-unit="1" title="Global Prehistory (30,000–500 BCE)">Unit 1: Prehistory</button>
        <button class="unit-tab" data-unit="2" title="Ancient Mediterranean (3,500 BCE–300 CE)">Unit 2: Ancient Med</button>
        <button class="unit-tab" data-unit="3" title="Early Europe & Colonial Americas (200–1750 CE)">Unit 3: Early Europe</button>
        <button class="unit-tab" data-unit="4" title="Later Europe & Americas (1750–1980 CE)">Unit 4: Later Europe</button>
        <button class="unit-tab" data-unit="5" title="Indigenous Americas (1000 BCE–1980 CE)">Unit 5: Indigenous Americas</button>
        <button class="unit-tab" data-unit="6" title="Africa (1100–1980 CE)">Unit 6: Africa</button>
        <button class="unit-tab" data-unit="7" title="West & Central Asia (500 BCE–1980 CE)">Unit 7: W & C Asia</button>
        <button class="unit-tab" data-unit="8" title="South, East & SE Asia (300 BCE–1980 CE)">Unit 8: Asia</button>
        <button class="unit-tab" data-unit="9" title="The Pacific (700–1980 CE)">Unit 9: Pacific</button>
        <button class="unit-tab" data-unit="10" title="Global Contemporary (1980 CE–Present)">Unit 10: Contemporary</button>
      </nav>

      <div class="status-counter" id="status-counter" aria-live="polite">
        Showing 250 of 250 works
      </div>
    </div>
  </header>

  <!-- Main Map & Artwork Panel Area -->
  <main class="app-workspace" role="main">
    <section class="map-container" aria-label="Interactive World Map of Artworks">
      <div id="map"></div>

      <!-- Hover Image Preview Card -->
      <div id="hover-preview-card" class="hover-preview-card" role="dialog" aria-hidden="true">
        <div class="hover-image-container">
          <img id="hover-img" src="../images/placeholder/artwork-placeholder.svg" alt="Artwork Preview">
          <button id="hover-prev-btn" class="hover-carousel-btn prev" aria-label="Previous image">&lt;</button>
          <button id="hover-next-btn" class="hover-carousel-btn next" aria-label="Next image">&gt;</button>
        </div>
        <div class="hover-footer-hint">Click marker or card for study details &rarr;</div>
      </div>
    </section>

    <!-- Side Artwork Details Panel -->
    <aside id="artwork-panel" class="artwork-panel" aria-label="Artwork Information and Study Analysis" aria-hidden="true">
      <div class="panel-header">
        <div class="panel-title-group">
          <a id="panel-ced-tag" class="panel-ced-tag panel-detail-link" href="#">CED #5</a>
          <h2><a id="panel-title" class="panel-detail-link" href="#">Artwork Title</a></h2>
        </div>
        <button id="panel-close-btn" class="panel-close-btn" aria-label="Close artwork details panel">&times;</button>
      </div>

      <div class="panel-body">
        <!-- Image & Carousel -->
        <div class="panel-image-section">
          <a id="panel-image-link" class="panel-image-link panel-detail-link" href="#">
            <div class="panel-image-display">
              <img id="panel-image" src="../images/placeholder/artwork-placeholder.svg" alt="Artwork Detail">
            </div>
          </a>
          <div class="panel-image-controls" id="panel-image-controls">
            <button id="panel-img-prev" class="panel-image-btn" aria-label="Previous image">&lt;</button>
            <button id="panel-img-next" class="panel-image-btn" aria-label="Next image">&gt;</button>
          </div>
          <a id="panel-image-caption" class="panel-image-caption panel-detail-link" href="#">Image source & attribution</a>
        </div>

        <!-- Metadata Table -->
        <table class="panel-meta-table">
          <tbody>
            <tr>
              <th>Artist/Culture</th>
              <td id="panel-meta-culture">—</td>
            </tr>
            <tr>
              <th>Date</th>
              <td id="panel-meta-date">—</td>
            </tr>
            <tr>
              <th>Medium</th>
              <td id="panel-meta-medium">—</td>
            </tr>
            <tr>
              <th>Location</th>
              <td id="panel-meta-location">—</td>
            </tr>
            <tr>
              <th>Unit</th>
              <td id="panel-meta-unit">—</td>
            </tr>
          </tbody>
        </table>

        <!-- AFFCC Detailed Study Sections -->
        <div id="panel-affcc-container">
          <!-- Dynamically populated from content/affcc/*.md -->
        </div>
      </div>
    </aside>
  </main>

  <!-- Bottom Date-Range Timeline -->
  <footer class="app-timeline" role="region" aria-label="Chronological Timeline Filter">
    <div class="timeline-top-bar">
      <div class="timeline-title-group">
        <span class="timeline-title">Timeline Range</span>
        <span id="timeline-range-label" class="timeline-range-label">30,000 BCE – Present</span>
      </div>

      <!-- Manual Date Inputs -->
      <div class="timeline-inputs">
        <label for="input-start-year">Start:</label>
        <input type="text" id="input-start-year" class="year-input" placeholder="-30000" value="30,000 BCE" aria-label="Start year">
        
        <label for="input-end-year">End:</label>
        <input type="text" id="input-end-year" class="year-input" placeholder="2026" value="2026 CE" aria-label="End year">
        
        <button id="btn-apply-years" class="btn" style="padding: 2px 8px; font-size: 11px;">Apply</button>
      </div>
    </div>

    <!-- Dual Handle Track -->
    <div class="timeline-track-container" id="timeline-track-container">
      <div class="timeline-track" id="timeline-track">
        <div class="timeline-highlight-span" id="timeline-highlight-span"></div>
      </div>
      <div class="timeline-handle" id="timeline-handle-start" role="slider" tabindex="0" aria-label="Start date handle" aria-valuemin="-30000" aria-valuemax="2026" aria-valuenow="-30000"></div>
      <div class="timeline-handle" id="timeline-handle-end" role="slider" tabindex="0" aria-label="End date handle" aria-valuemin="-30000" aria-valuemax="2026" aria-valuenow="2026"></div>
      <div class="timeline-artwork-dots" id="timeline-artwork-dots"></div>
      <div class="timeline-ticks" id="timeline-ticks"></div>
    </div>
  </footer>

  <!-- Application Modules -->
  <script src="../js/vendor/leaflet.js"></script>
  <script src="../js/vendor/leaflet.markercluster.js"></script>
  <script src="../js/sticky-header.js"></script>
  <script src="../js/dateUtils.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/filters.js"></script>
  <script src="../js/map.js"></script>
  <script src="../js/timeline.js"></script>
  <script src="../js/search.js"></script>
  <script src="../js/vocab-linker.js"></script>
  <script src="../js/vocab-hovercard.js"></script>
  <script src="../js/artwork-render.js"></script>
  <script src="../js/artwork-panel.js"></script>
  <script src="../js/random.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
