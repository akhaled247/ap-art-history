<!DOCTYPE html>
<html lang="en" class="list-page-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <title>AP Art History — CED Artwork List</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="list-page">

  <header class="app-header app-header--page" role="banner">
    <div class="header-top">
      <div class="brand-title">
        <h1>AP Art History</h1>
        <span class="badge">250 Required Works</span>
      </div>

      <div class="search-container" role="search">
        <label for="artwork-search-input" class="sr-only">Search artworks by CED number, title, artist, culture, or location</label>
        <input
          type="text"
          id="artwork-search-input"
          class="search-input"
          placeholder="Search by title, artist, CED #, culture..."
          autocomplete="off"
          aria-expanded="false"
          aria-haspopup="listbox"
        >
        <button id="search-clear-btn" class="search-clear" aria-label="Clear search input">&times;</button>
        <div id="search-dropdown" class="search-dropdown" role="listbox"></div>
      </div>

      <div class="header-controls">
        <a href="map/" class="btn btn-subtle header-nav-link">Map</a>
        <a href="./" class="btn btn-subtle header-nav-link active" aria-current="page">Browse List</a>
        <a href="vocab/" class="btn btn-subtle header-nav-link">Vocabulary</a>
        <a href="network/" class="btn btn-subtle header-nav-link">Network</a>
      </div>
    </div>

    <div class="header-bottom">
      <nav class="unit-presets" id="list-unit-nav" aria-label="AP Art History Unit Presets">
        <button class="unit-tab active" data-unit="all">All Works (1–250)</button>
        <button class="unit-tab" data-unit="1" title="Global Prehistory (30,000–500 BCE)">Unit 1: Prehistory</button>
        <button class="unit-tab" data-unit="2" title="Ancient Mediterranean (3,500 BCE–300 CE)">Unit 2: Ancient Med</button>
        <button class="unit-tab" data-unit="3" title="Early Europe &amp; Colonial Americas (200–1750 CE)">Unit 3: Early Europe</button>
        <button class="unit-tab" data-unit="4" title="Later Europe &amp; Americas (1750–1980 CE)">Unit 4: Later Europe</button>
        <button class="unit-tab" data-unit="5" title="Indigenous Americas (1000 BCE–1980 CE)">Unit 5: Indigenous Americas</button>
        <button class="unit-tab" data-unit="6" title="Africa (1100–1980 CE)">Unit 6: Africa</button>
        <button class="unit-tab" data-unit="7" title="West &amp; Central Asia (500 BCE–1980 CE)">Unit 7: W & C Asia</button>
        <button class="unit-tab" data-unit="8" title="South, East &amp; SE Asia (300 BCE–1980 CE)">Unit 8: Asia</button>
        <button class="unit-tab" data-unit="9" title="The Pacific (700–1980 CE)">Unit 9: Pacific</button>
        <button class="unit-tab" data-unit="10" title="Global Contemporary (1980 CE–Present)">Unit 10: Contemporary</button>
      </nav>

      <div class="status-counter" id="list-status-counter" aria-live="polite">Showing 250 of 250 works</div>
    </div>
  </header>

  <main class="list-page-main" role="main">
    <div class="vocab-toolbar">
      <div class="vocab-view-tabs" role="tablist" aria-label="List views">
        <button type="button" id="list-view-browse" class="vocab-view-tab unit-tab active" role="tab" aria-selected="true" aria-controls="list-browse-panel">Browse</button>
        <button type="button" id="list-view-quiz" class="vocab-view-tab unit-tab" role="tab" aria-selected="false" aria-controls="list-quiz-panel">Attribution</button>
        <button type="button" id="list-view-connect" class="vocab-view-tab unit-tab" role="tab" aria-selected="false" aria-controls="list-connect-panel">Connect</button>
      </div>
    </div>

    <div id="list-browse-panel" class="list-panel" role="tabpanel">
      <div id="artwork-list" class="artwork-list" aria-label="CED artwork list">
        <div class="loading-note">Loading artworks...</div>
      </div>
    </div>

    <div id="list-quiz-panel" class="list-panel vocab-quiz list-quiz-panel" role="tabpanel" hidden>
      <div id="list-quiz-image-wrap" class="list-quiz-image-wrap">
        <img id="list-quiz-image" class="list-quiz-image" src="" alt="" hidden>
      </div>
      <div id="list-quiz-score" class="vocab-quiz-score">Score: 0 / 0</div>
      <p id="list-quiz-prompt" class="vocab-quiz-prompt">Loading quiz...</p>
      <div id="list-quiz-options" class="vocab-quiz-options" role="group" aria-label="Answer choices"></div>
      <p id="list-quiz-feedback" class="vocab-quiz-feedback" aria-live="polite"></p>
      <button type="button" id="list-quiz-next" class="btn btn-primary vocab-quiz-next" hidden>Next Question</button>
    </div>

    <div id="list-connect-panel" class="list-panel vocab-quiz list-quiz-panel list-connect-panel" role="tabpanel" hidden>
      <div class="list-connect-settings">
        <fieldset class="list-connect-units-fieldset">
          <legend class="list-connect-legend">Units for this session</legend>
          <p class="list-connect-help">Choose which units to include. The unit bar in the header applies to <strong>Browse</strong> and <strong>Attribution</strong> only.</p>
          <div id="list-connect-units" class="list-connect-units">
            <label class="list-connect-unit-all"><input type="checkbox" id="list-connect-unit-all" checked> All units</label>
            <label><input type="checkbox" data-unit="1"> Unit 1</label>
            <label><input type="checkbox" data-unit="2"> Unit 2</label>
            <label><input type="checkbox" data-unit="3"> Unit 3</label>
            <label><input type="checkbox" data-unit="4"> Unit 4</label>
            <label><input type="checkbox" data-unit="5"> Unit 5</label>
            <label><input type="checkbox" data-unit="6"> Unit 6</label>
            <label><input type="checkbox" data-unit="7"> Unit 7</label>
            <label><input type="checkbox" data-unit="8"> Unit 8</label>
            <label><input type="checkbox" data-unit="9"> Unit 9</label>
            <label><input type="checkbox" data-unit="10"> Unit 10</label>
          </div>
        </fieldset>
        <label class="list-connect-attribution-toggle">
          <input type="checkbox" id="list-connect-include-attribution">
          Include attribution questions (culture, date, medium, location, title)
        </label>
      </div>
      <div id="list-connect-image-wrap" class="list-quiz-image-wrap">
        <img id="list-connect-image" class="list-quiz-image" src="" alt="" hidden>
      </div>
      <div id="list-connect-score" class="vocab-quiz-score">Score: 0 / 0</div>
      <p id="list-connect-prompt" class="vocab-quiz-prompt">Loading...</p>
      <p id="list-connect-prompt-detail" class="list-connect-prompt-detail" aria-live="polite"></p>
      <div id="list-connect-options" class="vocab-quiz-options" role="group" aria-label="Answer choices"></div>
      <p id="list-connect-feedback" class="vocab-quiz-feedback" aria-live="polite"></p>
      <button type="button" id="list-connect-next" class="btn btn-primary vocab-quiz-next" hidden>Next Question</button>
    </div>
  </main>

  <script src="js/sticky-header.js"></script>
  <script src="js/data.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/artwork-render.js"></script>
  <script src="js/artwork-quiz.js"></script>
  <script src="js/artwork-association-quiz.js"></script>
  <script src="js/mixed-list-quiz.js"></script>
  <script src="js/search.js"></script>
  <script src="js/list.js"></script>
  <script src="js/list-view-tabs.js"></script>
  <script src="js/list-quiz.js"></script>
  <script src="js/list-association-quiz.js"></script>
</body>
</html>
